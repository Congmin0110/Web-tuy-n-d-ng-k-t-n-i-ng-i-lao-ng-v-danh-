<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tin tuyển dụng — Kết Nối Việc</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: "Be Vietnam Pro", sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="site-header"></div>

  <main class="mx-auto grid max-w-6xl gap-6 px-4 py-8 lg:grid-cols-5">
    <!-- === KHU VỰC 1: ĐĂNG VÀ SỬA TIN === -->
    <section class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm lg:col-span-2">
      <h1 id="form-title" class="text-2xl font-bold">Đăng tin mới</h1>
      <p class="mt-1 text-sm text-slate-500">Tin mới và tin vừa sửa đều chờ quản trị viên duyệt trước khi hiện ra trang tìm việc.</p>
      <p id="alert" class="mt-4 hidden"></p>
      <form id="job-form" class="mt-4 grid gap-3">
        <input type="hidden" id="job-id">
        <label class="text-sm font-medium">Tiêu đề
          <input id="title" required class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2">
        </label>
        <label class="text-sm font-medium">Ngành nghề
          <select id="category" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2"></select>
        </label>
        <label class="text-sm font-medium">Địa điểm
          <input id="location" required class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2" placeholder="Hà Nội, Đà Nẵng...">
        </label>
        <div class="grid grid-cols-2 gap-3">
          <label class="text-sm font-medium">Lương từ (đồng)
            <input id="salaryMin" type="number" min="0" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2">
          </label>
          <label class="text-sm font-medium">Lương đến (đồng)
            <input id="salaryMax" type="number" min="0" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2">
          </label>
        </div>
        <label class="text-sm font-medium">Mô tả công việc
          <textarea id="description" rows="4" required class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2"></textarea>
        </label>
        <label class="text-sm font-medium">Yêu cầu
          <textarea id="requirements" rows="3" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2"></textarea>
        </label>
        <div class="flex gap-2">
          <button class="rounded-xl bg-emerald-600 px-4 py-2 font-semibold text-white hover:bg-emerald-700" type="submit">Lưu tin</button>
          <button id="btn-cancel" class="hidden rounded-xl border border-slate-300 px-4 py-2 font-semibold" type="button">Hủy sửa</button>
        </div>
      </form>

      <form id="company-form" class="mt-8 border-t border-slate-200 pt-5">
        <h2 class="font-bold">Tên doanh nghiệp trên tin</h2>
        <p id="company-alert" class="mt-3 hidden"></p>
        <label class="mt-3 block text-sm font-medium">Tên công ty
          <input id="companyName" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2">
        </label>
        <button class="mt-3 rounded-xl border border-slate-300 px-4 py-2 text-sm font-semibold hover:bg-slate-50" type="submit">Lưu tên công ty</button>
      </form>
    </section>

    <!-- === KHU VỰC 2: DANH SÁCH TIN CỦA TÔI === -->
    <section class="lg:col-span-3">
      <div class="mb-4 flex items-center justify-between gap-3">
        <h2 class="text-2xl font-bold">Tin đã đăng</h2>
        <a class="text-sm font-semibold text-emerald-700" href="candidates.html">Xem ứng viên</a>
      </div>
      <div id="my-jobs" class="grid gap-4"></div>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    renderHeader();
    if (!requireRole(['employer'])) {
      // Đã chuyển trang đăng nhập nếu sai vai trò.
    } else {
      fillCategorySelect(document.getElementById('category'), false);
      taiTinCuaToi();
      taiTenCongTy();
    }

    let danhSachTin = [];

    // === KHU VỰC 1: ĐĂNG VÀ SỬA TIN ===
    function xoaForm() {
      document.getElementById('job-form').reset();
      document.getElementById('job-id').value = '';
      document.getElementById('form-title').textContent = 'Đăng tin mới';
      document.getElementById('btn-cancel').classList.add('hidden');
    }

    function dienFormSua(job) {
      document.getElementById('job-id').value = job._id;
      document.getElementById('title').value = job.title;
      document.getElementById('category').value = job.category;
      document.getElementById('location').value = job.location;
      document.getElementById('salaryMin').value = job.salaryMin || '';
      document.getElementById('salaryMax').value = job.salaryMax || '';
      document.getElementById('description').value = job.description;
      document.getElementById('requirements').value = job.requirements || '';
      document.getElementById('form-title').textContent = 'Sửa tin';
      document.getElementById('btn-cancel').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function docFormTin() {
      return {
        title: document.getElementById('title').value.trim(),
        category: document.getElementById('category').value,
        location: document.getElementById('location').value.trim(),
        salaryMin: document.getElementById('salaryMin').value,
        salaryMax: document.getElementById('salaryMax').value,
        description: document.getElementById('description').value.trim(),
        requirements: document.getElementById('requirements').value.trim()
      };
    }

    async function luuTin(event) {
      event.preventDefault();
      setAlert('alert', '');
      const id = document.getElementById('job-id').value;
      const dangSua = Boolean(id);
      try {
        const data = await apiRequest(dangSua ? '/api/employer/jobs/' + id : '/api/employer/jobs', {
          method: dangSua ? 'PUT' : 'POST',
          body: JSON.stringify(docFormTin())
        });
        setAlert('alert', data.message, 'success');
        xoaForm();
        taiTinCuaToi();
      } catch (error) {
        setAlert('alert', error.message, 'error');
      }
    }

    async function xoaTin(id) {
      if (!window.confirm('Xóa tin này và toàn bộ hồ sơ đã nộp?')) return;
      try {
        const data = await apiRequest('/api/employer/jobs/' + id, { method: 'DELETE' });
        setAlert('alert', data.message, 'success');
        if (document.getElementById('job-id').value === id) xoaForm();
        taiTinCuaToi();
      } catch (error) {
        setAlert('alert', error.message, 'error');
      }
    }

    // === KHU VỰC 2: DANH SÁCH TIN CỦA TÔI ===
    function veTin(job) {
      const lyDo = job.status === 'rejected' && job.rejectReason
        ? '<p class="mt-2 text-sm text-rose-700">Lý do ẩn: ' + escapeHtml(job.rejectReason) + '</p>'
        : '';
      return ''
        + '<article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm" data-id="' + job._id + '">'
        + '  <div class="flex flex-wrap items-start justify-between gap-3">'
        + '    <div>'
        + '      <h3 class="text-lg font-bold">' + escapeHtml(job.title) + '</h3>'
        + '      <p class="text-sm text-slate-500">' + escapeHtml(job.location) + ' · ' + escapeHtml(job.category) + '</p>'
        + '      <p class="mt-1 text-sm font-semibold">' + escapeHtml(formatSalary(job.salaryMin, job.salaryMax)) + '</p>'
        + '    </div>'
        + statusBadge('job', job.status)
        + '  </div>'
        + lyDo
        + '  <div class="mt-4 flex gap-2">'
        + '    <button type="button" data-action="edit" class="rounded-xl border border-slate-300 px-3 py-2 text-sm font-semibold">Sửa</button>'
        + '    <button type="button" data-action="delete" class="rounded-xl border border-rose-200 px-3 py-2 text-sm font-semibold text-rose-700">Xóa</button>'
        + '  </div>'
        + '</article>';
    }

    async function taiTinCuaToi() {
      try {
        const data = await apiRequest('/api/employer/jobs');
        danhSachTin = data.jobs || [];
        const box = document.getElementById('my-jobs');
        if (!danhSachTin.length) {
          box.innerHTML = '<div class="rounded-2xl border border-dashed border-slate-300 bg-white p-8 text-slate-500">Bạn chưa có tin nào.</div>';
          return;
        }
        box.innerHTML = danhSachTin.map(veTin).join('');
      } catch (error) {
        setAlert('alert', error.message, 'error');
      }
    }

    document.getElementById('my-jobs').addEventListener('click', function (event) {
      const button = event.target.closest('button');
      if (!button) return;
      const card = button.closest('[data-id]');
      const id = card.getAttribute('data-id');
      const job = danhSachTin.find((item) => item._id === id);
      if (button.getAttribute('data-action') === 'edit' && job) dienFormSua(job);
      if (button.getAttribute('data-action') === 'delete') xoaTin(id);
    });

    // === KHU VỰC 3: TÊN DOANH NGHIỆP ===
    async function taiTenCongTy() {
      try {
        const data = await apiRequest('/api/profile');
        document.getElementById('companyName').value = data.user.companyName || '';
      } catch (error) {
        setAlert('company-alert', error.message, 'error');
      }
    }

    async function luuTenCongTy(event) {
      event.preventDefault();
      try {
        const data = await apiRequest('/api/profile', {
          method: 'PUT',
          body: JSON.stringify({
            name: getUser().name,
            companyName: document.getElementById('companyName').value.trim()
          })
        });
        const session = getUser();
        session.companyName = data.user.companyName || '';
        localStorage.setItem('user', JSON.stringify(session));
        setAlert('company-alert', 'Đã lưu tên doanh nghiệp. Tin đăng sau sẽ dùng tên này.', 'success');
      } catch (error) {
        setAlert('company-alert', error.message, 'error');
      }
    }

    document.getElementById('job-form').addEventListener('submit', luuTin);
    document.getElementById('btn-cancel').addEventListener('click', xoaForm);
    document.getElementById('company-form').addEventListener('submit', luuTenCongTy);
  </script>
</body>
</html>
