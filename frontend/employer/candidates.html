<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ứng viên — Kết Nối Việc</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: "Be Vietnam Pro", sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="site-header"></div>

  <main class="mx-auto max-w-5xl px-4 py-8">
    <!-- === KHU VỰC 1: LỌC HỒ SƠ ỨNG VIÊN === -->
    <h1 class="text-2xl font-bold">Ứng viên và lịch phỏng vấn</h1>
    <p class="mt-1 text-sm text-slate-500">Lọc theo tin hoặc trạng thái, rồi đặt giờ hẹn. Ứng viên thấy lịch này trong mục Đơn đã nộp.</p>
    <form id="filter-form" class="mt-5 grid gap-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm md:grid-cols-3">
      <select id="jobId" class="rounded-xl border border-slate-300 px-3 py-2">
        <option value="">Tất cả tin của tôi</option>
      </select>
      <select id="status" class="rounded-xl border border-slate-300 px-3 py-2">
        <option value="">Mọi trạng thái</option>
        <option value="pending">Đã nộp</option>
        <option value="reviewed">Đã xem</option>
        <option value="interview">Mời phỏng vấn</option>
        <option value="accepted">Trúng tuyển</option>
        <option value="rejected">Từ chối</option>
      </select>
      <button class="rounded-xl bg-emerald-600 px-4 py-2 font-semibold text-white hover:bg-emerald-700" type="submit">Lọc hồ sơ</button>
    </form>

    <p id="alert" class="mt-4 hidden"></p>
    <div id="candidate-list" class="mt-5 grid gap-4"></div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    renderHeader();
    if (requireRole(['employer'])) {
      taiBoLocTin();
      taiUngVien();
    }

    // === KHU VỰC 1: TẢI BỘ LỌC VÀ DANH SÁCH CV ===
    async function taiBoLocTin() {
      try {
        const data = await apiRequest('/api/employer/jobs');
        const select = document.getElementById('jobId');
        (data.jobs || []).forEach(function (job) {
          const option = document.createElement('option');
          option.value = job._id;
          option.textContent = job.title;
          select.appendChild(option);
        });
      } catch (error) {
        setAlert('alert', error.message, 'error');
      }
    }

    function veUngVien(item) {
      const user = item.userId || {};
      const job = item.jobId || {};
      const cv = safeHref(item.cvLink);
      return ''
        + '<article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm" data-id="' + item._id + '">'
        + '  <div class="flex flex-wrap items-start justify-between gap-3">'
        + '    <div>'
        + '      <h2 class="text-lg font-bold">' + escapeHtml(user.name || 'Ứng viên') + '</h2>'
        + '      <p class="text-sm text-slate-500">' + escapeHtml(user.email || '') + (user.phone ? ' · ' + escapeHtml(user.phone) : '') + '</p>'
        + '      <p class="mt-1 text-sm">Ứng tuyển: <b>' + escapeHtml(job.title || '') + '</b></p>'
        + (user.skills ? '<p class="mt-1 text-sm text-slate-600">Kỹ năng: ' + escapeHtml(user.skills) + '</p>' : '')
        + (item.note ? '<p class="mt-1 text-sm text-slate-600">Lời nhắn: ' + escapeHtml(item.note) + '</p>' : '')
        + (cv ? '<a class="mt-2 inline-block text-sm font-semibold text-emerald-700" target="_blank" rel="noopener" href="' + escapeHtml(cv) + '">Mở CV</a>' : '')
        + '    </div>'
        + statusBadge('app', item.status)
        + '  </div>'
        + '  <div class="mt-4 grid gap-3 md:grid-cols-3">'
        + '    <label class="text-sm font-medium">Trạng thái'
        + '      <select data-field="status" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2">'
        + optionTrangThai(item.status)
        + '      </select>'
        + '    </label>'
        + '    <label class="text-sm font-medium">Giờ phỏng vấn'
        + '      <input data-field="interviewDate" type="datetime-local" value="' + escapeHtml(toDatetimeLocal(item.interviewDate)) + '" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2">'
        + '    </label>'
        + '    <label class="text-sm font-medium">Ghi chú lịch hẹn'
        + '      <input data-field="interviewNote" value="' + escapeHtml(item.interviewNote || '') + '" class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2" placeholder="Địa điểm hoặc link họp">'
        + '    </label>'
        + '  </div>'
        + '  <button type="button" data-action="save" class="mt-3 rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white">Lưu lịch và trạng thái</button>'
        + '</article>';
    }

    function optionTrangThai(current) {
      const ds = [
        ['pending', 'Đã nộp'],
        ['reviewed', 'Đã xem'],
        ['interview', 'Mời phỏng vấn'],
        ['accepted', 'Trúng tuyển'],
        ['rejected', 'Từ chối']
      ];
      return ds.map(function (item) {
        const selected = item[0] === current ? ' selected' : '';
        return '<option value="' + item[0] + '"' + selected + '>' + item[1] + '</option>';
      }).join('');
    }

    async function taiUngVien() {
      setAlert('alert', '');
      const params = new URLSearchParams();
      const jobId = document.getElementById('jobId').value;
      const status = document.getElementById('status').value;
      if (jobId) params.set('jobId', jobId);
      if (status) params.set('status', status);
      const qs = params.toString();
      try {
        const data = await apiRequest('/api/employer/applications' + (qs ? '?' + qs : ''));
        const list = data.applications || [];
        const box = document.getElementById('candidate-list');
        if (!list.length) {
          box.innerHTML = '<div class="rounded-2xl border border-dashed border-slate-300 bg-white p-8 text-slate-500">Chưa có hồ sơ nào khớp bộ lọc.</div>';
          return;
        }
        box.innerHTML = list.map(veUngVien).join('');
      } catch (error) {
        setAlert('alert', error.message, 'error');
      }
    }

    // === KHU VỰC 2: ĐẶT LỊCH PHỎNG VẤN ===
    async function luuLich(card) {
      const id = card.getAttribute('data-id');
      const status = card.querySelector('[data-field="status"]').value;
      const gioDaChon = card.querySelector('[data-field="interviewDate"]').value;
      let interviewDate = '';
      if (gioDaChon) {
        const date = new Date(gioDaChon);
        if (Number.isNaN(date.getTime())) {
          setAlert('alert', 'Thời gian phỏng vấn không hợp lệ.', 'error');
          return;
        }
        interviewDate = date.toISOString();
      }
      const interviewNote = card.querySelector('[data-field="interviewNote"]').value.trim();
      try {
        const data = await apiRequest('/api/employer/applications/' + id, {
          method: 'PUT',
          body: JSON.stringify({ status, interviewDate, interviewNote })
        });
        setAlert('alert', data.message, 'success');
        taiUngVien();
      } catch (error) {
        setAlert('alert', error.message, 'error');
      }
    }

    document.getElementById('filter-form').addEventListener('submit', function (event) {
      event.preventDefault();
      taiUngVien();
    });

    document.getElementById('candidate-list').addEventListener('click', function (event) {
      const button = event.target.closest('[data-action="save"]');
      if (!button) return;
      luuLich(button.closest('[data-id]'));
    });
  </script>
</body>
</html>
