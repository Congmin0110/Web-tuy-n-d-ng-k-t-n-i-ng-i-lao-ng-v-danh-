<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đơn đã nộp — Kết Nối Việc</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: "Be Vietnam Pro", sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="site-header"></div>

  <main class="mx-auto max-w-4xl px-4 py-8">
    <!-- === KHU VỰC 1: THEO DÕI TRẠNG THÁI VÀ LỊCH PHỎNG VẤN === -->
    <h1 class="text-2xl font-bold">Đơn ứng tuyển của tôi</h1>
    <p class="mt-1 text-sm text-slate-500">Khi nhà tuyển dụng đặt lịch, thời gian phỏng vấn hiện ngay trên từng đơn.</p>
    <p id="alert" class="mt-4 hidden"></p>
    <div id="application-list" class="mt-6 grid gap-4"></div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    renderHeader();
    if (requireRole(['user'])) {
      taiDonCuaToi();
    }

    // === KHU VỰC 1: TẢI ĐƠN VÀ LỊCH HẸN ===
    function veMotDon(item) {
      const job = item.jobId || {};
      const cv = safeHref(item.cvLink);
      const lich = item.interviewDate
        ? '<p class="mt-3 rounded-xl bg-indigo-50 px-3 py-2 text-sm text-indigo-900"><b>Lịch phỏng vấn:</b> ' + escapeHtml(formatDate(item.interviewDate)) + (item.interviewNote ? '<br>' + escapeHtml(item.interviewNote) : '') + '</p>'
        : '<p class="mt-3 text-sm text-slate-500">Chưa có lịch phỏng vấn.</p>';

      return ''
        + '<article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">'
        + '  <div class="flex flex-wrap items-start justify-between gap-3">'
        + '    <div>'
        + '      <h2 class="text-lg font-bold">' + escapeHtml(job.title || 'Tin đã bị gỡ') + '</h2>'
        + '      <p class="text-sm text-slate-500">' + escapeHtml(job.companyName || '') + (job.location ? ' · ' + escapeHtml(job.location) : '') + '</p>'
        + '    </div>'
        + statusBadge('app', item.status)
        + '  </div>'
        + lich
        + (item.note ? '<p class="mt-3 text-sm text-slate-600">Lời nhắn của bạn: ' + escapeHtml(item.note) + '</p>' : '')
        + (cv ? '<a class="mt-3 inline-block text-sm font-semibold text-emerald-700" target="_blank" rel="noopener" href="' + escapeHtml(cv) + '">Mở CV đã nộp</a>' : '')
        + '</article>';
    }

    async function taiDonCuaToi() {
      try {
        const data = await apiRequest('/api/applications/me');
        const list = data.applications || [];
        const box = document.getElementById('application-list');
        if (!list.length) {
          box.innerHTML = '<div class="rounded-2xl border border-dashed border-slate-300 bg-white p-8 text-slate-500">Bạn chưa nộp CV nào. Hãy quay lại trang tìm việc.</div>';
          return;
        }
        box.innerHTML = list.map(veMotDon).join('');
      } catch (error) {
        setAlert('alert', error.message, 'error');
      }
    }
  </script>
</body>
</html>
